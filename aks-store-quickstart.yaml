apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-front
  template:
    metadata:
      labels:
        app: python-front
    spec:
      containers:
      - name: python-front
        image: jeremyvosstest.azurecr.io/aks/aks-node-and-python-app:1.1
        ports:
        - name: python-port
          containerPort: 8082
        - name: node-port
          containerPort: 3000
        # volumeMounts:
        # - name: azure-monitor-auto-instrumentation-volume-python
        #   mountPath: "/agents/python"
        env:
        - name: PYTHONPATH
          value: "/agents/python/python"
        - name: APPLICATIONINSIGHTS_CONNECTION_STRING
          value: "InstrumentationKey=ec500fd4-d1b0-48e4-8bea-85d15385b671;IngestionEndpoint=https://centralus-2.in.applicationinsights.azure.com/;LiveEndpoint=https://centralus.livediagnostics.monitor.azure.com/;ApplicationId=4592960f-3e47-45b7-bae3-7c9e9d788943"
      # initContainers:
      # - name: python-agent
      #   image: mcr.microsoft.com/applicationinsights/auto-instrumentation/python:1.0.0b15
      #   command:
      #   - cp
      #   - -r
      #   - /agents/python/
      #   - /azure-monitor-auto-instrumentation-python
      #   resources:
      #     limits:
      #       cpu: '2'
      #       memory: 1Gi
      #     requests:
      #       cpu: 100m
      #       memory: 128Mi
      #   volumeMounts:
      #   - name: azure-monitor-auto-instrumentation-volume-python
      #     mountPath: /azure-monitor-auto-instrumentation-python
      # volumes:
      #   - name: azure-monitor-auto-instrumentation-volume-python
      #     emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: python-front
spec:
  ports:
  - name: python-port
    port: 82
    targetPort: 8082
  - name: node-port
    port: 81
    targetPort: 3000
  selector:
    app: python-front
  type: LoadBalancer
