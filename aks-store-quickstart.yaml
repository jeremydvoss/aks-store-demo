apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-front
  template:
    metadata:
      labels:
        app: python-front
    spec:
      containers:
      - name: python-front
        # image: jeremyvosstest.azurecr.io/aks/aks-node-python-java-app:1.0
        # image: jeremyvosstest.azurecr.io/custom_container/django:0.6-aks-manual
        # image: jeremyvosstest.azurecr.io/e2e/python/testappflask/auto/3.13:2025-08-20-16-23-24
        # image: jeremyvosstest.azurecr.io/e2e/python/testappdjango/auto/3.13:2025-08-20-16-34-06
        image: jeremyvosstest.azurecr.io/e2e/python/testappfastapi/auto/3.13:2025-08-20-16-26-51
        # image: jeremyvosstest.azurecr.io/aks/aks-node-python-java-app:1.0
        ports:
        - name: java-port
          containerPort: 8080
        - name: python-port
          containerPort: 8082
          #8000 for django
        - name: node-port
          containerPort: 3000
        volumeMounts:
        - name: azure-monitor-auto-instrumentation-volume-python
          mountPath: "/custom-agents/python" # put the volume here.
        - name: azure-monitor-auto-instrumentation-volume-nodejs
          mountPath: "/agents/nodejs"
        - name: azure-monitor-auto-instrumentation-volume-java
          mountPath: "/agents/java"
        env:
        - name: PYTHONPATH
          value: "/custom-agents/python"
        - name: NODE_OPTIONS
          value: '--require /agents/nodejs/otel/aks.js'
        - name: _JAVA_OPTIONS
          value: '-javaagent:/agents/java/applicationinsights-agent-codeless.jar'
        - name: APPLICATIONINSIGHTS_CONNECTION_STRING
          value: "InstrumentationKey=ec500fd4-d1b0-48e4-8bea-85d15385b671;IngestionEndpoint=https://centralus-2.in.applicationinsights.azure.com/;LiveEndpoint=https://centralus.livediagnostics.monitor.azure.com/;ApplicationId=4592960f-3e47-45b7-bae3-7c9e9d788943"
        - name: AKS_ARM_NAMESPACE_ID
          value: "TEST_AKS_ARM_NAMESPACE_ID"
        - name: POD_NAMESPACE
          value: TEST_POD_NAMESPACE
        - name: POD_NAME
          value: TEST_POD_NAME
        - name: POD_UID
          value: TEST_POD_UID
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "cloud.resource_id=/subscriptions/66010356-d8a5-42d3-8593-6aaa3aeb1c11/resourcegroups/alkaplan/providers/Microsoft.ContainerService/managedClusters/attach-manual,cloud.region=eastus2,k8s.cluster.name=attach-manual,k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.container.name=flask-container,cloud.provider=Azure,cloud.platform=azure_aks,k8s.deployment.name=python-app,k8s.deployment.uid=0d79db13-8ab2-484d-8f52-70482b84c19e"
        - name: DJANGO_SETTINGS_MODULE
          value: "django_app.settings"
        - name: PYTHON_TEST_APP_PORT
          value: "8082"
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "256Mi"
            cpu: "1000m"
      initContainers:
      - name: python-agent
        image: mcr.microsoft.com/applicationinsights/auto-instrumentation/python:1.0.0b28-aks
        # image: python-aks:dev2
        command:
        - cp
        - -r
        - /agents/python/.
        - /azure-monitor-auto-instrumentation-volume-python-temp/ # copy to root of volume
        resources:
          limits:
            cpu: '2'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: azure-monitor-auto-instrumentation-volume-python
          mountPath: /azure-monitor-auto-instrumentation-volume-python-temp
      - name: node-agent
        image: mcr.microsoft.com/applicationinsights/auto-instrumentation/nodejs:2.11.4
        # image: mcr.microsoft.com/applicationinsights/opentelemetry-auto-instrumentation/nodejs:3.2.3
        command:
        - cp
        - -r
        - /agents/nodejs/.
        - /azure-monitor-auto-instrumentation-nodejs
        resources:
          limits:
            cpu: '2'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: azure-monitor-auto-instrumentation-volume-nodejs
          mountPath: /azure-monitor-auto-instrumentation-nodejs
      - name: java-agent
        image: mcr.microsoft.com/applicationinsights/auto-instrumentation/java:3.5.2-aks
        command:
        - cp
        - -r
        - /agents/java/.
        - /azure-monitor-auto-instrumentation-java
        resources:
          limits:
            cpu: '2'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: azure-monitor-auto-instrumentation-volume-java
          mountPath: /azure-monitor-auto-instrumentation-java
      volumes:
        - name: azure-monitor-auto-instrumentation-volume-python
          emptyDir: {}
        - name: azure-monitor-auto-instrumentation-volume-nodejs
          emptyDir: {}
        - name: azure-monitor-auto-instrumentation-volume-java
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: python-front
spec:
  ports:
  - name: java-port
    port: 83
    targetPort: 8080
  - name: python-port
    port: 82
    targetPort: 8082
  - name: node-port
    port: 81
    targetPort: 3000
  selector:
    app: python-front
  type: LoadBalancer